name: Release APK

# Publishes a signed APK on every GitHub release, including pre-releases.
# The workflow file must be on the default branch before a release can trigger it.
#
# The APK is built unsigned with JDK 21, then signed with apksigner from
# build-tools 34. F-Droid rebuilds with Debian OpenJDK 21 and can copy that
# signature. The Android Gradle Plugin signer, and apksigner 35 or newer,
# produce a signature F-Droid cannot verify.
#
#   ANDROID_KEYSTORE_BASE64      base64 -w 0 release.keystore
#   ANDROID_KEYSTORE_PASSWORD    keystore password
#   ANDROID_KEY_ALIAS            key alias inside the keystore
#   ANDROID_KEY_PASSWORD         key password
#

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is empty. Add the four signing secrets listed at the top of this workflow."
            exit 1
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.keystore"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not set on this runner."
            exit 1
          fi
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${sdkmanager}" ]; then
            echo "sdkmanager was not found at ${sdkmanager}"
            exit 1
          fi
          yes | "${sdkmanager}" --licenses >/dev/null || true
          # 35 compiles the app. 34 is used only for signing.
          "${sdkmanager}" --install "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"

      - name: Build the unsigned release APK
        run: |
          set -euo pipefail
          # This file pins JetBrains JDK 25. Both sides have to build with JDK 21.
          rm -f gradle/gradle-daemon-jvm.properties
          ./gradlew assembleRelease

      - name: Sign with apksigner 34 and attach the APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] || [ -z "${ANDROID_KEY_ALIAS}" ] || [ -z "${ANDROID_KEY_PASSWORD}" ]; then
            echo "ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD must be set."
            exit 1
          fi
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "${unsigned}" ]; then
            echo "Unsigned APK was not produced at ${unsigned}."
            if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
              echo "Found a signed APK. Gradle signed the build, so ANDROID_KEYSTORE_FILE reached Gradle."
            fi
            exit 1
          fi
          apksigner="${ANDROID_HOME}/build-tools/34.0.0/apksigner"
          if [ ! -x "${apksigner}" ]; then
            echo "apksigner 34.0.0 was not found at ${apksigner}"
            exit 1
          fi
          safe_tag="$(printf '%s' "${RELEASE_TAG}" | tr -c 'A-Za-z0-9._-' '-')"
          asset="SimpleYMD-${safe_tag}.apk"
          "${apksigner}" sign \
            --ks "${RUNNER_TEMP}/release.keystore" \
            --ks-key-alias "${ANDROID_KEY_ALIAS}" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "${asset}" \
            "${unsigned}"
          "${apksigner}" verify --print-certs "${asset}"
          gh release upload "${RELEASE_TAG}" "${asset}" --clobber
