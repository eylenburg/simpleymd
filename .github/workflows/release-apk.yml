name: Release APK

# Publishes a signed APK on every GitHub release, including pre-releases.
# The workflow file must be on the default branch before a release can trigger it.
#
#   ANDROID_KEYSTORE_BASE64      base64 -w 0 release.keystore
#   ANDROID_KEYSTORE_PASSWORD    keystore password
#   ANDROID_KEY_ALIAS            key alias inside the keystore
#   ANDROID_KEY_PASSWORD         key password
#

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JetBrains Runtime 25
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is empty. Add the four signing secrets listed at the top of this workflow."
            exit 1
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.keystore"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not set on this runner."
            exit 1
          fi
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${sdkmanager}" ]; then
            echo "sdkmanager was not found at ${sdkmanager}"
            exit 1
          fi
          yes | "${sdkmanager}" --licenses >/dev/null || true
          "${sdkmanager}" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Build the signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # AGP 8.7.3 release lint crashes on JDK 25: JavaVersion.parse rejects 25.0.x.
        # This repo's Gradle daemon is JDK 25, so those tasks cannot run here.
        # R8 minification and APK packaging still run.
        run: ./gradlew assembleRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease

      - name: Check the signature and attach the APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "${apk}" ]; then
            echo "Signed APK was not produced at ${apk}."
            echo "An unsigned file here means the keystore secrets did not reach Gradle."
            exit 1
          fi
          apksigner="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort | tail -n 1)"
          if [ -z "${apksigner}" ]; then
            echo "apksigner was not found under ${ANDROID_HOME}/build-tools"
            exit 1
          fi
          "${apksigner}" verify --print-certs "${apk}"
          safe_tag="$(printf '%s' "${RELEASE_TAG}" | tr -c 'A-Za-z0-9._-' '-')"
          asset="SimpleYMD-${safe_tag}.apk"
          cp "${apk}" "${asset}"
          gh release upload "${RELEASE_TAG}" "${asset}" --clobber
